<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>꼬물꼬물 · 지렁이 게임</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><a class="brand" href="./">〰 꼬물꼬물</a><span>작은 정원, 끝없는 도전</span></header><section class="intro"><p class="eyebrow">THE LITTLE WORM CLUB</p><h1>한 입 먹고,<br>조금 더 길어지자.</h1><p>사과를 모아 정원에서 가장 긴 지렁이가 되어 보세요.</p></section><section class="game"><div class="toolbar"><div>점수 <strong id="score">0</strong></div><div>최고 기록 <strong id="best">0</strong></div><button id="pause" disabled>일시정지</button></div><div class="board"><canvas id="canvas" width="600" height="600" aria-label="지렁이 게임판"></canvas><div id="overlay"><span class="worm">〰</span><h2 id="title">준비됐나요?</h2><p id="message">먹이를 먹고 쑥쑥 자라 보세요.</p><button id="start">게임 시작 ↗</button></div></div><div class="bottom"><label>속도 <select id="speed"><option value="160">느긋하게</option><option value="115" selected>보통으로</option><option value="75">빠르게</option></select></label><span id="status" role="status">시작 버튼을 눌러 주세요</span></div></section><div class="controls" aria-label="방향 조작"><button data-dir="up" aria-label="위">↑</button><div><button data-dir="left" aria-label="왼쪽">←</button><button data-dir="down" aria-label="아래">↓</button><button data-dir="right" aria-label="오른쪽">→</button></div></div><footer><p><kbd>↑</kbd> <kbd>←</kbd> <kbd>↓</kbd> <kbd>→</kbd> 또는 <kbd>W A S D</kbd> 이동 <span>·</span> <kbd>Space</kbd> 일시정지</p><p>벽이나 내 몸에 닿으면 끝! 화면을 쓸어 넘겨도 움직일 수 있어요.</p></footer></main><script src="game.js"></script></body></html>
